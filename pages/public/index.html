<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="dns-prefetch" href="https://images.unsplash.com">

    <!-- Google Fonts: Montserrat (optimized) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

            <div class="card-grid">
                <a href="galeria-publica.html" class="featured-service-card" style="background-image: url('https://picsum.photos/seed/bodas/800/600');">
                    <div class="card-content">
                        <h3>ejemplo1</h3>
                    </div>
                </a>
                <a href="galeria-publica.html" class="featured-service-card" style="background-image: url('https://picsum.photos/seed/prebodas/800/600');">
                    <div class="card-content">
                        <h3>ejemplo2</h3>
                    </div>
                </a>
                <a href="galeria-publica.html" class="featured-service-card" style="background-image: url('https://picsum.photos/seed/postbodas/800/600');">

                        <h3>ejemplo5</h3>
                    </div>
                </a>
                <a href="galeria-publica.html" class="featured-service-card" style="background-image: url('https://picsum.photos/seed/newborn/800/600');">
                    <div class="card-content">
                        <h3>ejemplo6</h3>
                    </div>
                </a>
            </div>
        </section>

    <section class="parallax-divider">
        <div class="parallax-overlay"></div>
        <div class="parallax-content">
            <h2>No capturamos poses, capturamos emociones</h2>
            <a href="contacto.html" class="btn-outline">Descubre cómo lo hacemos</a>
        </div>
    </section>

    <!-- Footer Loader -->
    <div data-include="../../components/footer.html"></div>

    <!-- Scripts (defer for better performance) -->
    <script src="../../js/include.js" defer></script>
